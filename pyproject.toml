[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: lanfear contains a compiled C++/pybind11 extension (`lanfear/_core`).
# Build it first with `./build.sh` (CMake + Boost + pybind11 from `load_py313`);
# the resulting `lanfear/_core*.so` is then packaged by the wheel build below.
# An editable install (`pip install -e .`) imports the extension in place.

[project]
name = "lanfear"
dynamic = ["version"]                     # read from lanfear/__init__.py
requires-python = ">=3.11"

authors = [
    {name = "Alex Rawlings", email = "rawlings@mpa-garching.mpg.de"}
]
maintainers = [
    {name = "Alex Rawlings", email = "rawlings@mpa-garching.mpg.de"}
]
description = "LANFEAR: Linear Analytic N-body Field Expansion to Ascertain Resonances. For galaxy simulations (analytic SCF/disc potentials, MPI orbit integration, frequency analysis and classification)"
readme = "README.md"
license = {text = "GNU General Public License v3"}
keywords = [
    "astronomy",
    "galaxy-dynamics",
    "orbits",
    "self-consistent-field",
    "N-body",
]

dependencies = [
    "numpy>=1.22",
    "h5py>=3.6",
    "matplotlib>=3.5",                     # classification plotting helpers
]

# Optional dependencies for specific use cases
[project.optional-dependencies]
# MPI-parallel orbit integration (serial runs work without it)
mpi = [
    "mpi4py>=3.1",
]
# Tools needed to compile the C++ extension via ./build.sh
build = [
    "pybind11>=2.10",
    "cmake>=3.15",
]
# Development
dev = [
    "ruff==0.7.4",
    "pre-commit",
    "pytest",
    "scipy>=1.8.0",                        # used by the disc-basis tests
]

[project.urls]
Repository = "https://github.com/alex-rawlings/lanfear"

[tool.hatch.version]
path = "lanfear/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lanfear"]
# Force-include the CMake-built extension even though it is git-ignored.
artifacts = ["lanfear/*.so"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "thirdparty",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F403",  # "from module import *" used
    "E203",  # "whitespace before ',', ';', or ':'"
    "E402",  # "Module level import not at top of file" (breaks paper-specific matplotlibrc import)
    "E731",  # "do not assign a lambda expression, use a def"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
